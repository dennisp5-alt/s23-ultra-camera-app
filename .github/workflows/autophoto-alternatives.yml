name: Build AutoPhoto Quality Lab v0.4.1
on:
  push:
    branches: [autophoto-quality-lab-v041]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pretrained MobileIE and image-adaptive 3D LUT weights
        shell: bash
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet onnx==1.17.0 numpy tflite
          python3 -m pip install --quiet "onnxruntime==1.20.1" "huggingface_hub==0.36.0"
          python3 scripts/prepare_alternatives.py
          python3 scripts/prepare_scene.py
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify trained models are packaged
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          apk=next(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              for name in ["assets/mobileie_lolv1.tflite","assets/lut_classifier.onnx",
                           "assets/lut_basis_33.bin","assets/skywater_segformer_b2_fp32.onnx"]:
                  item=z.getinfo(name)
                  print(name, item.file_size,"bytes")
                  assert item.file_size>10000
          PY
      - name: Check ML Kit bundled segmentation dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          apk=next(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              assert any(n.endswith(".dex") for n in names)
              libs=[n for n in names if n.startswith("lib/") and n.endswith(".so")]
              assets=[n for n in names if n.startswith("assets/")]
              print("Native libraries",len(libs), "Assets",len(assets))
              print("Potential segmentation assets", [x for x in assets if "selfie" in x.lower() or "segment" in x.lower()][:40])
              assert len(libs)>0, "Native offline runtimes missing"
          PY
      - name: Verify independent preset mode and previous correction engines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/example/autophoto/LocalDetailProcessor.kt").read_text()
          ui=Path("app/src/main/java/com/example/autophoto/MainActivity.kt").read_text()
          assert all(t in p for t in ["enum class Strength", "GENTLE(", "BALANCED(", "STRONG(", "inputMeanY", "outputMeanY"])
          assert "LocalDetailProcessor.enhance(source, preset)" in ui
          assert all(t in ui for t in ["ImageProcessor.correct(input)", "MaskedAIProcessor.enhanceScene", "detailProgressActive = false"])
          assert "applicationId = \"com.example.autophoto.qualitylab.v041\"" in Path("app/build.gradle.kts").read_text()
          print("Three selectable presets, original Auto, scene engine, and isolated app ID verified")
          PY
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPhoto-Quality-Lab-v0.4.1-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish directly downloadable APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autophoto-quality-lab-v0.4.1
          name: AutoPhoto Quality Lab v0.4.1 — Three-strength Edge-aware Local Detail
          make_latest: false
          generate_release_notes: false
          body: |
            Separate quality-first experiment, based on working v0.3.9.1.
            Independent update to the successful v0.4.0 local-detail experiment.
            Adds Gentle, Balanced and Strong, each computed from the untouched
            original photo; improved texture-sensitive local enhancement and
            clipping/halo/highlight/bokeh/skin/red-flower safeguards.
            Fixes stale 100% progress display. Adds input/output luminance
            metrics calculated before JPEG export for image comparison.
            All Auto and neural AI modes unchanged, fully offline.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
