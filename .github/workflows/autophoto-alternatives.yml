name: Build AutoPhoto Studio Clean v0.4.9
on:
  push:
    branches: [autophoto-studio-clean-v049]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # CI compares Polished against the parent stable release.
          # Default shallow checkout cannot resolve that parent commit.
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pretrained MobileIE and image-adaptive 3D LUT weights
        shell: bash
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet onnx==1.17.0 numpy tflite
          python3 -m pip install --quiet "onnxruntime==1.20.1" "huggingface_hub==0.36.0"
          python3 scripts/prepare_alternatives.py
          python3 scripts/prepare_scene.py
          python3 scripts/prepare_studio_clean.py
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify trained models are packaged
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          apk=next(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              for name in ["assets/mobileie_lolv1.tflite","assets/lut_classifier.onnx",
                           "assets/lut_basis_33.bin","assets/skywater_segformer_b2_fp32.onnx",
                           "assets/studio_dncnn_color_blind.onnx"]:
                  item=z.getinfo(name)
                  print(name, item.file_size,"bytes")
                  assert item.file_size>10000
          PY
      - name: Check ML Kit bundled segmentation dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          apk=next(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              assert any(n.endswith(".dex") for n in names)
              libs=[n for n in names if n.startswith("lib/") and n.endswith(".so")]
              assets=[n for n in names if n.startswith("assets/")]
              print("Native libraries",len(libs), "Assets",len(assets))
              print("Potential segmentation assets", [x for x in assets if "selfie" in x.lower() or "segment" in x.lower()][:40])
              assert len(libs)>0, "Native offline runtimes missing"
          PY
      - name: Verify independent preset mode and previous correction engines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/example/autophoto/LocalDetailProcessor.kt").read_text()
          ui=Path("app/src/main/java/com/example/autophoto/MainActivity.kt").read_text()
          assert all(t in p for t in ["enum class Strength", "GENTLE(", "BALANCED(", "STRONG(", "inputMeanY", "outputMeanY"])
          assert "LocalDetailProcessor.enhance(source, preset)" in ui
          assert "LocalDetailProcessor.enhanceAdaptiveStrong(source)" in ui
          assert "fun enhanceAdaptiveStrong(" in p
          assert "localMinimumY" in p and "skinGuide" in p and "skyGuide" in p
          assert all(t in ui for t in ["ImageProcessor.correct(input)", "MaskedAIProcessor.enhanceScene", "detailProgressActive = false"])
          assert "applicationId = \"com.example.autophoto.studioclean.v049\"" in Path("app/build.gradle.kts").read_text()
          polished=Path("app/src/main/java/com/example/autophoto/PolishedAIProcessor.kt").read_text()
          assert all(t in polished for t in [
              'AlternativeAIProcessor.adaptiveLut(',
              'POLISHED("Polished"', 'POLISHED_PLUS("Polished+"',
              'WOW("Wow"', 'darkSceneProtected = darkScene'
          ])
          assert all(t in ui for t in [
              "PolishedAIProcessor.enhance(",
              "refreshPolishedButtons()",
              "runPolishedAI()"
          ])
          assert "safeChromaScale(" in polished and "val wowFinish = if (style == Style.WOW)" in polished
          assert "val plusFinish = if (style == Style.POLISHED_PLUS)" in polished
          assert 'POLISHED("Polished", 0.75f, 0.10f, 5.0f, 0.12f, 0.24f)' in polished
          assert 'WOW("Wow", 0.75f, 0.10f, 5.0f, 0.12f, 0.24f)' in polished
          assert "if (style == Style.POLISHED)" in polished
          assert "depthOpportunity" in polished and "protectedPetals" in polished
          assert "private var polishedStyle = PolishedAIProcessor.Style.POLISHED" in ui
          assert "if (visible) {" in ui and '"Wow", PolishedAIProcessor.Style.WOW, visible = false)' in ui
          assert 'info.text = "${bitmap.width} × ${bitmap.height} • ${polishedStyle.label} selected"' in ui
          assert "highResolutionCheckBox = CheckBox(this)" in ui
          assert "maxMemory()" in ui and "20_000_000.0" in ui
          bridge = Path("app/src/main/java/com/example/autophoto/ColourProfileBridge.kt").read_text()
          assert "safeExifTags = arrayOf(" in ui
          assert "sourceProfile = ColourProfileBridge.detect(imageInfo.colorSpace)" in ui
          assert "ColourProfileBridge.encodeP3(" in ui
          assert "ColourProfileBridge.isVerifiedP3(contentResolver, uri)" in ui
          assert "highResolutionCheckBox.visibility = View.GONE" in ui
          assert "ColorSpace.connect(srgb,p3)" in bridge
          assert "nativeBytes.get(off)" in bridge
          assert "delta[c]-=dy" in bridge
          assert "copyPixelsFromBuffer(result)" in bridge
          assert "ICC_PROFILE" in bridge
          assert "BitmapFactory.decodeByteArray" in bridge
          assert "BitmapFactory.decodeFileDescriptor" in bridge
          assert "decoder.setTargetColorSpace(p3)" in bridge
          assert "Other RGB → sRGB" in bridge
          assert "ExifInterface.TAG_ORIENTATION" in ui
          assert "ExifInterface.TAG_GPS" not in ui
          assert "applicationId = \"com.example.autophoto.studioclean.v049\"" in Path("app/build.gradle.kts").read_text()
          import hashlib
          # Git blob SHA of the approved v0.4.6 processor. This checks the
          # actual file bytes without depending on Git checkout ancestry.
          payload = polished.encode("utf-8")
          blob = hashlib.sha1(
              b"blob " + str(len(payload)).encode("ascii") + bytes([0]) + payload
          ).hexdigest()
          assert blob == "ea92bd74ef01997e228a5c8de7ddd08e2aa7644a", (
              "Approved Polished processor has changed: " + blob
          )
          assert "for (button in arrayOf(openButton, saveButton))" in ui
          assert "private fun updatePreviewStatus()" in ui
          assert "Viewing: ORIGINAL" in ui
          assert 'Saved: " + save.profileUsed' in ui
          assert "highResolutionCheckBox.visibility = View.GONE" in ui
          assert "root.addView(finishingControls" in ui
          assert "polishedRow.visibility = View.GONE" in ui
          assert "private fun runStudioClean()" in ui
          studio=Path("app/src/main/java/com/example/autophoto/StudioCleanProcessor.kt").read_text()
          assert "StudioCleanProcessor.enhance(" in ui
          assert "studio_dncnn_color_blind.onnx" in studio
          assert "PolishedAIProcessor.Style.POLISHED" in studio
          assert "MAX_TILES=12" in studio
          assert "denY-luminance(o)" in studio
          assert "return Result(polished.bitmap" in studio
          assert "decodePhoto(uri, highResolutionEnabled)" in ui
          assert "root.addView(finishingControls," in ui
          assert "root.addView(polishedRow," in ui
          assert not any("root.addView(" + legacy + "," in ui for legacy in [
              "maskedButton", "semanticButton", "sceneButton", "detailButton",
              "detailAdaptiveButton", "strengthRow", "aiControls"])
          assert "Run Polished AI" in ui
          print("Only Open/Save and Polished choice controls rendered, all original engines retained")
          PY
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPhoto-Studio-Clean-v0.4.9-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish directly downloadable APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autophoto-studio-clean-v0.4.9
          name: AutoPhoto Studio Clean v0.4.9 — Restoration A/B
          make_latest: false
          generate_release_notes: false
          body: |
            v0.4.9 Studio Clean is a BULK QC experiment (NOT a new approved
            Polished look). Unchanged approved v0.4.6 Polished processor
            and pretrained ONNX adaptive LUT. Additional offline pretrained
            DnCNN colour-blind denoiser from cszn/KAIR, built as ONNX and
            applied only to limited noisy image patches with guarded
            luminance-only fusion. Original photo remains untouched.
            New two-button Polished/Studio Clean A/B UI; persistent true
            ORIGINAL/PROCESSED label; explicit input ICC and saved output ICC;
            accurate technical diagnostics replacing misleading 'adjusted'
            and 'clipping' claims. sRGB/P3 profile matching retained with
            verified-P3 or safe sRGB fallback. Safe GPS-free EXIF preserved.
            Unique app ID keeps 0.4.6, 0.4.7 and 0.4.8 untouched.
            Model/runtime and actual photographic benefit need phone testing.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
