name: Build AutoPhoto Alternative AI Lab v0.3.5
on:
  push:
    branches: [autophoto-ai-masked-v035]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pretrained MobileIE and image-adaptive 3D LUT weights
        shell: bash
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet onnx==1.17.0 numpy tflite
          python3 scripts/prepare_alternatives.py
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify trained models are packaged
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          apk=next(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              for name in ["assets/mobileie_lolv1.tflite","assets/lut_classifier.onnx","assets/lut_basis_33.bin"]:
                  item=z.getinfo(name)
                  print(name, item.file_size,"bytes")
                  assert item.file_size>10000
          PY
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPhoto-AI-Lab-v0.3.5-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
