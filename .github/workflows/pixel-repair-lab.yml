name: Pixel Repair Lab APK
on:
  push:
    branches: [pixel-repair-lab]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android 35 using preinstalled SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unit tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Repair-Lab-v0.3.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pixel-Repair-Lab-v0.3.0.apk
          if gh release view pixel-repair-v0.3.0 >/dev/null 2>&1; then
            gh release upload pixel-repair-v0.3.0 Pixel-Repair-Lab-v0.3.0.apk --clobber
          else
            gh release create pixel-repair-v0.3.0 Pixel-Repair-Lab-v0.3.0.apk --target "$GITHUB_SHA" --title "Pixel Repair Lab v0.3.0 (Standalone Android)" --notes "Offline experimental pixel-by-pixel repair app. Separate from Photo Master AI. Debug signed for personal testing." --prerelease
          fi
      - name: Publish raw APK mirror on experimental branch
        shell: bash
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Pixel-Repair-Lab-v0.3.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/Pixel-Repair-Lab-v0.3.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish standalone Pixel Repair Lab v0.2 APK mirror"
            git push origin HEAD:pixel-repair-lab
          fi
