name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Repair app Gradle file
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dennis.s23camera"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.dennis.s23camera"
                  minSdk = 35
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"

                  testInstrumentationRunner =
                      "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile(
                              "proguard-android-optimize.txt"
                          ),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.2.0")

              implementation("androidx.camera:camera-core:1.4.0")
              implementation("androidx.camera:camera-camera2:1.4.0")
              implementation("androidx.camera:camera-lifecycle:1.4.0")
              implementation("androidx.camera:camera-view:1.4.0")

              testImplementation("junit:junit:4.13.2")
              androidTestImplementation(
                  "androidx.test.ext:junit:1.2.1"
              )
              androidTestImplementation(
                  "androidx.test.espresso:espresso-core:3.6.1"
              )
          }
          EOF

      - name: Add missing camera drawables
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/camera_top_gradient.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <gradient
                  android:angle="270"
                  android:startColor="#CC000000"
                  android:endColor="#00000000" />

          </shape>
          EOF

          cat > app/src/main/res/drawable/camera_panel_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <solid android:color="#E61D1D1F" />

              <corners android:radius="24dp" />

              <stroke
                  android:width="1dp"
                  android:color="#33FFFFFF" />

          </shape>
          EOF

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK="$(
            find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: S23-Ultra-Camera-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
