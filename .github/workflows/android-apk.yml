name: Dennis AI Chat APK
on:
  push:
    branches: [ "ai-chat-v0.1" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dennis-AI-Chat-v0.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dennis_AI_Chat_v0.1_debug.apk
          if gh release view ai-chat-v0.1-preview >/dev/null 2>&1; then
            gh release upload ai-chat-v0.1-preview Dennis_AI_Chat_v0.1_debug.apk --clobber
          else
            gh release create ai-chat-v0.1-preview Dennis_AI_Chat_v0.1_debug.apk --title "Dennis AI Chat v0.1 Preview" --notes "Experimental offline AI chat build for Galaxy S23 Ultra. You must separately import a LiteRT-LM compatible local model. This does not ship an AI model." --prerelease --target "$GITHUB_SHA"
          fi
