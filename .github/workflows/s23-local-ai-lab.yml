name: S23 Local AI Lab experimental APK
on:
  push:
    branches: ["experiment/s23-local-ai-lab", "feature/local-ai-lab-**"]
    paths: ["local-ai-lab/**", ".github/workflows/s23-local-ai-lab.yml"]
  pull_request:
    branches: ["experiment/s23-local-ai-lab"]
    paths: ["local-ai-lab/**", ".github/workflows/s23-local-ai-lab.yml"]
  workflow_dispatch:
concurrency:
  group: s23-local-ai-lab-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write only to publish the pre-release download on pushes.
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install Android API 36 using runner SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Fixed signing key (optional)
        # With these four repository secrets, every build is signed with the same key and installs over the
        # previous one (keeping the imported model). Without them the runner's random debug key is used.
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lab-signing.jks"
            echo "LAB_SIGNING_STORE_FILE=$RUNNER_TEMP/lab-signing.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "No signing secrets: using a random debug key (uninstall the previous v0.4 build before installing)."
          fi
      - name: Test and build debug APK
        working-directory: local-ai-lab
        env:
          LAB_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          LAB_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          LAB_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S23-Local-AI-Lab-test-report
          path: local-ai-lab/app/build/reports/tests/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: S23-Local-AI-Lab-debug-APK
          path: local-ai-lab/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Publish pre-release download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="$(grep -oP 'versionName = "\K[^"]+' local-ai-lab/app/build.gradle.kts)"
          if [ "$BRANCH" = "experiment/s23-local-ai-lab" ]; then TAG="s23-local-ai-lab-v$VERSION"; else TAG="s23-local-ai-lab-v$VERSION-beta"; fi
          APK="S23-Local-AI-Lab-v$VERSION.apk"
          cp local-ai-lab/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "S23 Local AI Lab v$VERSION ($BRANCH)" \
            --notes "Experimental test build from $BRANCH at ${GITHUB_SHA::7}. Not for production. Installs alongside v0.3 (new app id com.dennisp.s23lab); import the model once."
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
