name: S23 Local AI Lab experimental APK
on:
  push:
    branches: ["experiment/s23-local-ai-lab"]
    paths: ["local-ai-lab/**", ".github/workflows/s23-local-ai-lab.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install Android API 36 using runner SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build debug APK
        working-directory: local-ai-lab
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: S23-Local-AI-Lab-debug-APK
          path: local-ai-lab/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
